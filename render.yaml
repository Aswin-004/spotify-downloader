version: "1"

services:
  # ── Web / API process ──────────────────────────────────────────────────────
  - name: spotify-downloader-api
    type: web
    runtime: python
    rootDir: backend
    buildCommand: apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: >
      python startup_check.py &&
      gunicorn
        --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker
        --workers 1
        --bind 0.0.0.0:$PORT
        --timeout 120
        --keep-alive 5
        --log-level info
        --access-logfile -
        --error-logfile -
        app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SOCKETIO_ASYNC_MODE
        value: gevent
      - key: SOCKETIO_ALLOW_UPGRADES
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: spotify-downloader-redis
          type: redis
          property: connectionString
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard → MongoDB Atlas URI
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        value: "https://spotify-downloader-asyp.onrender.com/callback"
      - key: ALLOWED_ORIGINS
        value: "https://spotify-downloader-three.vercel.app"
      - key: INGEST_PLAYLIST_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: DISABLE_BPM_ANALYSIS
        value: "1"      # CPU-heavy; disable on Render Starter (512 MB RAM)
      - key: DISABLE_FINGERPRINTING
        value: "1"
      - key: MAX_QUEUE_DEPTH
        value: "10"
      - key: YOUTUBE_COOKIES_B64
        sync: false   # base64-encoded Netscape cookies.txt from a YouTube-logged-in browser session

  # ── Redis (Render-managed) ────────────────────────────────────────────────
  - name: spotify-downloader-redis
    type: redis
    ipAllowList: []   # only internal access
    plan: free
    maxmemoryPolicy: noeviction
