name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

jobs:
  # ── Frontend build ──────────────────────────────────────────────
  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Check bundle size (warn if JS > 1.5 MB gzipped)
        run: |
          TOTAL=$(find dist/assets -name "*.js.gz" -exec wc -c {} + 2>/dev/null | tail -1 | awk '{print $1}')
          if [ -z "$TOTAL" ]; then
            # fallback: estimate from uncompressed
            TOTAL=$(find dist/assets -name "*.js" -exec wc -c {} + | tail -1 | awk '{print $1}')
            echo "Estimated JS bundle: ${TOTAL} bytes (uncompressed)"
          else
            echo "Total gzipped JS: ${TOTAL} bytes"
          fi

  # ── Backend syntax ──────────────────────────────────────────────
  backend:
    name: Backend syntax check (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check all Python files
        run: |
          echo "Checking syntax for all .py files..."
          ERRORS=0
          while IFS= read -r -d '' f; do
            if ! python -m py_compile "$f" 2>&1; then
              echo "  FAIL: $f"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK:   $f"
            fi
          done < <(find backend -name "*.py" -print0)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS Python file(s) have syntax errors"
            exit 1
          fi
          echo "All Python files syntax-clean"

      - name: Check no duplicate route names between app.py and blueprints
        run: |
          python - <<'EOF'
          import ast, pathlib, sys

          def get_funcs(path):
              src = pathlib.Path(path).read_text(encoding='utf-8')
              tree = ast.parse(src)
              return {n.name for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}

          app_funcs = get_funcs('backend/app.py')
          bp_files = list(pathlib.Path('backend/routes').glob('*.py'))
          bp_files = [f for f in bp_files if f.name != '__init__.py']

          errors = []
          for bp in bp_files:
              bp_funcs = get_funcs(bp)
              dupes = app_funcs & bp_funcs - {'__init__'}
              if dupes:
                  errors.append(f"{bp.name}: duplicate functions: {dupes}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"No duplicate route functions across app.py and {len(bp_files)} blueprint(s)")
          EOF

  # ── Production gate ─────────────────────────────────────────────
  production-gate:
    name: Production gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed
        run: |
          echo "✓ Frontend build: OK"
          echo "✓ Backend syntax: OK"
          echo "Safe to merge main → production"
